<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIGEC - Cambiar contraseña</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/icons/bootstrap-icons.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v={{ version }}">
</head>
<body class="login-bg">
<form class="login-card" method="post" autocomplete="off">
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <img class="logo" src="{{ url_for('static', filename='img/logo_login.png') }}" alt="SIGEC">
    <h1>Crea tu contraseña</h1>
    <p class="sub">Hola {{ nombre }}: ingresaste con una contraseña temporal. Elige una nueva para continuar.</p>
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for cat, msg in messages %}<div class="flash flash-{{ cat }}" style="text-align:left"><i class="bi bi-info-circle-fill"></i><span>{{ msg }}</span></div>{% endfor %}
    {% endwith %}
    <div class="fg"><label for="nueva">Nueva contraseña</label>
        <div class="input-ico"><i class="bi bi-lock"></i><input class="inp" id="nueva" name="nueva" type="password" minlength="8" required autofocus autocomplete="new-password" placeholder="Mínimo 8 caracteres"></div></div>
    <div class="fg"><label for="confirmar">Confirmar contraseña</label>
        <div class="input-ico"><i class="bi bi-lock-fill"></i><input class="inp" id="confirmar" name="confirmar" type="password" minlength="8" required autocomplete="new-password"></div></div>
    <button class="btn btn-primary" type="submit"><i class="bi bi-check-lg"></i> Guardar y continuar</button>
    <div class="login-foot"><a href="{{ url_for('logout') }}">Cancelar y salir</a></div>
</form>
</body>
</html>
